name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-scraper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: scraper/pyproject.toml
          architecture: x64

      - name: Install dependencies (and project)
        working-directory: scraper
        run: |
          pip install -U pip
          pip install -e .[test,scripts]

      - name: Run the tests
        working-directory: scraper
        run: inv coverage --args "-vvv"

      - name: Upload coverage report to codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  build-scraper:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: "ui/package.json"

      - name: Build ZIM UI
        working-directory: ui
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: scraper/pyproject.toml
          architecture: x64

      - name: Ensure we can build Python targets
        working-directory: scraper
        run: |
          pip install -U pip build
          python3 -m build --sdist --wheel

  build-and-test-zimui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: "ui/package.json"

      - name: Install dependencies
        working-directory: ui
        run: |
          npm ci

      - name: Generate language names
        working-directory: ui
        run: |
          npm run generate

      - name: Test
        working-directory: ui
        run: |
          npm run test:unit
          npm run test:integration

      - name: Build
        working-directory: ui
        run: |
          npm run build

      - name: Start web server
        working-directory: ui
        run: |
          npm run preview &

      - name: Wait for web server to be ready
        run: |
          npx wait-on http://localhost:5173

  run-integration-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Build the Docker image
        run: docker build -t gutenberg .

      - name: Ensure the Docker image contains the packaged ZIM UI
        run: |
          docker run --rm gutenberg python -c "from pathlib import Path; import gutenberg2zim; path = Path(gutenberg2zim.__file__).parent / 'zimui'; assert (path / 'index.html').is_file() and (path / 'assets').is_dir(), 'zimui not found'"

      - name: Install zimtools
        run: |
          wget -qO- https://download.openzim.org/release/zim-tools/zim-tools_linux-x86_64.tar.gz | tar xvz
          sudo mv zim-tools_linux-x86_64-*/zim* /usr/local/bin/

      - name: Build small integration ZIMs
        run: |
          mkdir -p output
          docker run --rm -v "$PWD/output:/output" gutenberg gutenberg2zim \
            --source gutenberg \
            --output /output \
            --zim-file /output/gutenberg-integration.zim \
            --zim-name gutenberg_integration_test \
            --zim-title "Gutenberg Test" \
            --zim-desc "One Project Gutenberg book for integration testing" \
            --books 11 \
            --formats html \
            --no-index \
            --overwrite
          docker run --rm -v "$PWD/output:/output" gutenberg gutenberg2zim \
            --source opentextbooks \
            --output /output \
            --zim-file /output/opentextbooks-integration.zim \
            --zim-name opentextbooks_integration_test \
            --zim-title "OTL Test" \
            --zim-desc "One Open Textbook Library book for integration testing" \
            --otl-ids 54 \
            --formats pdf \
            --no-index \
            --overwrite

      - name: Run zimcheck
        run: |
          zimcheck output/gutenberg-integration.zim
          zimcheck output/opentextbooks-integration.zim

      - name: Run integration test suite
        run: |
          docker run --rm \
            -v "$PWD/scraper/tests-integration:/src/scraper/tests-integration:ro" \
            -v "$PWD/output:/output:ro" \
            -e ZIM_DIRECTORY=/output \
            gutenberg \
            bash -c "pip install --no-cache-dir pytest && pytest -v /src/scraper/tests-integration"

      - name: Archive integration ZIMs
        uses: actions/upload-artifact@v6
        with:
          name: integration-zims
          path: output/*.zim
          retention-days: 7
